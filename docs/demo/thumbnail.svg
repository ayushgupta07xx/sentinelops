<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#27272a"/>
    </pattern>
    <radialGradient id="g1" cx="22%" cy="28%" r="55%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="82%" cy="78%" r="42%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f59e0b" stop-opacity="1"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#09090b"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#g1)"/>
  <rect width="1920" height="1080" fill="url(#g2)"/>

  <!-- Top-left brand -->
  <g transform="translate(96, 96)">
    <circle cx="8" cy="22" r="7" fill="#f59e0b"/>
    <text x="36" y="30" fill="#fafafa" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="24" font-weight="600" letter-spacing="4">SENTINELOPS</text>
  </g>

  <!-- Status pill -->
  <g transform="translate(96, 158)">
    <rect width="244" height="38" rx="19" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <circle cx="22" cy="19" r="4" fill="#22c55e"/>
    <text x="40" y="25" fill="#a1a1aa" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="13" letter-spacing="2">LIVE · MISTRAL-7B · QLORA</text>
  </g>

  <!-- Hero -->
  <text x="96" y="500" fill="#fafafa" font-family="Inter, system-ui, sans-serif" font-size="160" font-weight="700" letter-spacing="-7">Alert in.</text>
  <text x="96" y="730" fill="#fafafa" font-family="Inter, system-ui, sans-serif" font-size="160" font-weight="700" letter-spacing="-7">
    <tspan fill="#f59e0b">→ </tspan>Postmortem out.
  </text>

  <!-- Amber thin line accent -->
  <rect x="96" y="780" width="640" height="2" fill="url(#amberLine)"/>

  <!-- Subtitle -->
  <text x="96" y="858" fill="#a1a1aa" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="400">Agentic LLM copilot for SRE incident response.</text>

  <!-- Bottom-right tech stack -->
  <text x="1824" y="996" text-anchor="end" fill="#71717a" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="22" letter-spacing="1">vLLM · LangGraph · Qdrant · Kubernetes</text>
</svg>