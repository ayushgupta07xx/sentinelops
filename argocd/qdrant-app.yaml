apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qdrant
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Multi-source: chart from upstream repo + values from our git repo.
  sources:
    - repoURL: https://qdrant.github.io/qdrant-helm
      chart: qdrant
      targetRevision: 1.7.0   # verify with: helm search repo qdrant/qdrant
      helm:
        releaseName: qdrant
        valueFiles:
          - $values/deploy/helm/sentinelops/values/qdrant.yaml
    - repoURL: https://github.com/ayushgupta07xx/sentinelops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sentinelops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 5s, factor: 2, maxDuration: 3m }
