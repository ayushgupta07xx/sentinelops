name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Detect which top-level paths changed → drives matrix below.
  # -------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      eval: ${{ steps.filter.outputs.eval }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python:
              - '**/*.py'
              - 'pyproject.toml'
            eval:
              - 'serving/agent/**'
              - 'serving/rag/**'
              - 'serving/inference/**'
              - 'evaluation/**'
              - 'data/preprocessing/**'

  # -------------------------------------------------------------------------
  # Lint + format check.
  # -------------------------------------------------------------------------
  lint:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install ruff
        run: pip install ruff==0.7.4
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  # -------------------------------------------------------------------------
  # Pytest (skips gracefully if no tests/ dir).
  # -------------------------------------------------------------------------
  test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install (dev extras)
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          if [ -d tests ]; then
            pytest -q tests/
          else
            echo "no tests/ directory yet — skipping"
          fi

  # -------------------------------------------------------------------------
  # Trivy filesystem scan — fails on HIGH/CRITICAL vulns + misconfigs.
  # -------------------------------------------------------------------------
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: ".venv,node_modules,data/raw,data/processed,evaluation/reports"

  # -------------------------------------------------------------------------
  # Ragas eval gate — uses 8B (Path-C inner-loop) to keep CI fast + cheap.
  # Only runs when paths affecting model behavior change.
  # Compares latest report to evaluation/baselines/main_8b.json.
  # -------------------------------------------------------------------------
  eval-gate:
    needs: changes
    if: needs.changes.outputs.eval == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install (dev extras)
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify eval_inputs.jsonl exists
        run: |
          if [ ! -s evaluation/golden_set/eval_inputs.jsonl ]; then
            echo "::error::evaluation/golden_set/eval_inputs.jsonl is missing or empty."
            echo "::error::If you changed serving/agent/, serving/rag/, or prompts, regenerate locally:"
            echo "::error::    python evaluation/run_eval.py"
            echo "::error::then commit the refreshed eval_inputs.jsonl."
            exit 1
          fi
      - name: Run Ragas (8B inner-loop)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JUDGE_MODEL: llama-3.1-8b-instant
        run: python evaluation/ragas_suite.py
      - name: Check gate
        run: python evaluation/check_eval_gate.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-report-${{ github.sha }}
          path: evaluation/reports/ragas_*.json
          retention-days: 14
