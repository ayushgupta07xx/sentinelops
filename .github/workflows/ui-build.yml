name: UI build

on:
  push:
    branches: [main]
    paths:
      - "serving/ui/**"
      - ".github/workflows/ui-build.yml"
  pull_request:
    paths:
      - "serving/ui/**"
      - ".github/workflows/ui-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serving/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: serving/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check + build
        run: npm run build